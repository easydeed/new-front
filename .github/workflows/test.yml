name: Run Tests
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install backend dependencies
      run: pip install -r backend/requirements.txt
    - name: Run maintained backend suites (blocking)
      working-directory: backend
      env:
        JWT_SECRET_KEY: ci-test-secret
      run: pytest tests/ -q

  # RED-S4, first commit: the proof harnesses stop being merge-day
  # ceremonies.
  #
  # S1, S2 and S3 each shipped with a runnable proof, and none of them ran
  # anywhere but on the author's machine when the author remembered. That
  # is not a gate; it is a habit.
  #
  # The argument is not theoretical. S1's concurrency proof caught a bug
  # IN S1 — psycopg2's getconn() raises rather than blocks when the pool
  # is exhausted, so a burst wider than DB_POOL_MAX became hard 500s — and
  # it surfaced only because one run's burst happened to be wider than the
  # last. Every future catch of that kind was, until this job existed, a
  # function of luck and diligence. CI exists to replace exactly that.
  #
  # A Postgres service container is what these need and what the rest of
  # the suite has been skipping for: dozens of tests carry
  # `skipif(not DATABASE_URL)` and have therefore never run in CI either.
  # They do now.
  proof-harnesses:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: deedpro_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/deedpro_ci
      JWT_SECRET_KEY: ci-test-secret
      ARTIFACT_STORE: filesystem
      ARTIFACT_FS_ROOT: /tmp/ci-artifacts
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install backend dependencies
      run: pip install -r backend/requirements.txt

    # pg_dump/pg_restore are REAL tools in the S2 drill, not stand-ins, so
    # the client major must match the server major — an older pg_dump
    # refuses a newer server outright ("server version mismatch"), which
    # would fail the drill for a reason that has nothing to do with the
    # thing it proves.
    - name: Install postgresql-client 16 (matching the service)
      run: |
        sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
        curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
        sudo apt-get update -qq
        sudo apt-get install -y -qq postgresql-client-16
        pg_dump --version

    # The DB-backed tests, which the no-Postgres job silently skips.
    - name: Backend suite WITH a database
      working-directory: backend
      run: pytest tests/ -q

    - name: S1 — concurrency proof (pool, induced failure, burst)
      working-directory: backend
      run: python scripts/s1_concurrency_proof.py

    - name: S2 — restore drill (dump, restore, hash-verify, second copy)
      working-directory: backend
      run: python scripts/s2_restore_drill.py

    - name: S3 — the Thursday walkthrough
      working-directory: backend
      run: python scripts/s3_thursday_walkthrough.py

    - name: Six-flow baseline
      working-directory: backend
      run: python scripts/six_flow_baseline.py verify

    - name: API baseline
      working-directory: backend
      run: python scripts/api_baseline.py verify

  # RED-H1.1: the frontend suite now RUNS. It did not before.
  #
  # 486 tests across 34 suites existed and no workflow invoked jest. Every
  # "jest 486 passed" line in every PR body this project has shipped was a
  # local run, on trust. A frontend regression could merge green.
  #
  # Blocking, and that is the point: if something is red the wave stops.
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - working-directory: frontend
      run: npm ci
    - name: Jest (blocking)
      working-directory: frontend
      run: npx jest --ci

  tsc-baseline:
    # RED-H1.1: was `tsc-report`, `continue-on-error: true`, with a comment
    # claiming "116 known pre-existing errors" against a baseline that has
    # been frozen at 94 for weeks. A documented invariant that no machine
    # checks is a preference.
    #
    # The tsc-only-goes-down rule is now enforced: the job fails if the
    # count EXCEEDS the baseline, and tells you to lower the baseline if it
    # drops. Note the `|| true` below is NOT a swallowed failure — tsc
    # exits non-zero whenever any error exists, so it would abort the step
    # before the count could be compared. The gate is the comparison, and
    # the comparison exits 1.
    runs-on: ubuntu-latest
    env:
      TSC_BASELINE: 94
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - working-directory: frontend
      run: npm ci
    - name: Type errors must not exceed the frozen baseline
      working-directory: frontend
      run: |
        # Measure on a clean tree. A stale .next/ makes tsc type-check
        # GENERATED route types too, so a build artifact from a deleted
        # route reports errors for a page that no longer exists — found
        # exactly that way: 99 with residue, 94 without.
        rm -rf .next
        npx tsc --noEmit > tsc.out 2>&1 || true
        COUNT=$(grep -c "error TS" tsc.out || true)
        echo "tsc errors: $COUNT (baseline $TSC_BASELINE)"
        if [ "$COUNT" -gt "$TSC_BASELINE" ]; then
          echo "::error::tsc regressed: $COUNT errors, baseline is $TSC_BASELINE"
          grep "error TS" tsc.out | tail -20
          exit 1
        fi
        if [ "$COUNT" -lt "$TSC_BASELINE" ]; then
          echo "::notice::tsc improved to $COUNT — lower TSC_BASELINE in this file to lock the gain in."
        fi
