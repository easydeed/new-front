name: Release readiness (no deployment)

# Owner-approved preparation, 2026-11-06. The former scheduled deployment
# recipe never parsed. Fixing its condition must not activate deployments.
# This workflow validates one main SHA and records an owner checkpoint only.
on:
  pull_request:
    paths:
      - .github/workflows/release-train.yml
      - scripts/check_release_readiness.py
      - backend/tests/test_release_readiness.py
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact main commit to review (full 40-character SHA)
        required: true
        type: string
      owner_acknowledgment:
        description: I am the repository owner requesting this release review, not a deployment
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install PyYAML==6.0.2
      - run: python -m unittest discover -s backend/tests -p test_release_readiness.py -v

  candidate:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: guard-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refuse unapproved, stale, unprotected or failing candidates
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          OWNER_ACKNOWLEDGMENT: ${{ inputs.owner_acknowledgment }}
        run: python scripts/check_release_readiness.py

  owner-checkpoint:
    needs: candidate
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: production-release-review
    timeout-minutes: 5
    steps:
      - name: Record review only
        run: echo "Owner checkpoint reached for $GITHUB_SHA. No deployment performed."
