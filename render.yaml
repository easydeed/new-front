# ⚠️ THIS FILE IS NOT THE SERVICE INVENTORY — BUT IT *IS* THE
#    ENVIRONMENT CONTRACT FOR THE SERVICE IT DESCRIBES.
#
# Two different claims, and the distinction is the point.
#
# NOT THE SERVICE INVENTORY. Services are managed in the Render
# dashboard. This file describes `deedpro-main-api` and nothing else —
# the purge cron job (`signer_contact_purge`, added 2026-08-11) runs in
# production and does not appear here, and neither will anything else
# created in the dashboard. Recorded because a config file that lies by
# OMISSION is harder to catch than one that lies by contents: nothing
# about a YAML file announces that it is a subset.
#
# IT IS THE ENVIRONMENT CONTRACT for `deedpro-main-api`, as of
# 2026-08-11, and that half is now checked. Every variable the service
# REQUIRES is declared below and cross-checked against
# `backend/services/environment.py`, which the API reads at boot and
# which prints a named block for anything missing.
#
# WHY THAT CHANGED. `FRONTEND_URL` is read in sixteen places, three of
# them Stripe redirect URLs carrying a `http://localhost:3000` fallback —
# so an unset variable sends a paying customer to a page on their own
# machine, silently. It appeared in NO configuration file in this
# repository. Nothing declared it should exist, so nothing could notice
# it did not. That is the defect class this whole engagement has been
# closing: a fact the system depends on, that nothing checks.
#
# ⚠️ DECLARING A VARIABLE HERE DOES NOT APPLY IT. This file is read by
#    the repo's tests, not by the running service; the dashboard is where
#    values live. `services/environment.py` closes half the loop by
#    reporting what the REAL service is missing at boot — see the note on
#    PYTHON_VERSION below for the half it structurally cannot close.
#
# A variable whose value is a SECRET is declared here with `sync: false`
# — the key is named, the value stays in the dashboard. Declaring the
# name is the whole point; declaring the value would be the thing the
# ledger forbids.
#
# Owner-ruled 2026-08-11: every service defined here pins PYTHON_VERSION
# explicitly. An unpinned service inherits whatever Render's default is
# on the day it builds, so the runtime can change under a service nobody
# touched — which is exactly how the cron's first build died compiling
# Rust for a pydantic_core with no 3.14 wheel.
#
# THE PIN IS 3.12.7, AND IT IS A DELIBERATE DOWNGRADE. The main API is
# currently on 3.13 (read off its build log's cp313 wheel tags); the cron
# got 3.14, today's Render default. 3.12 is chosen for wheel coverage
# across the current dependency set — one minor below the edge, where
# every package we depend on publishes binaries — and, more importantly,
# because a pinned version removes the "whichever default existed the day
# this service was created" nondeterminism entirely. Three services on
# three Pythons is not a configuration, it is an accident with a history.
#
# See docs/OWNER_LEDGER.md, "render.yaml — owner ruling".

# Fixed monorepo deployment configuration
services:
# ============================================================================
# MAIN API (Existing - Port 8000)
# ============================================================================
- type: web
  name: deedpro-main-api
  env: python
  plan: free
  repo: https://github.com/easydeed/new-front
  branch: main
  rootDir: backend
  buildCommand: pip install -r requirements.txt
  startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
  envVars:
  # Pinned, not inherited. See the header: this is a downgrade from the
  # 3.13 the service runs today, and the main API must be redeployed and
  # its build watched before this is considered settled.
  #
  # ⚠️ AND IT DID NOT TAKE. Confirmed 2026-08-12: this declaration is
  # here, and the value still had to be set by hand in the Render
  # dashboard. That is the proof behind the header's warning — the file
  # DECLARES, it does not APPLY.
  #
  # Nothing was going to catch it, either, and the reason is worth
  # keeping: the boot report in `services/environment.py` reads the REAL
  # environment on the REAL service, so it does catch dashboard drift —
  # for variables the PROCESS reads at RUNTIME, and only the ones the
  # manifest marks REQUIRED. `PYTHON_VERSION` is neither. Render consumes
  # it at BUILD time, before the process that would report it exists.
  #
  # That bounds the mechanism rather than refuting it. `FRONTEND_URL` is
  # runtime and REQUIRED, which is exactly the case the boot check does
  # see.
  - key: PYTHON_VERSION
    value: "3.12.7"
  - key: DATABASE_URL
    fromDatabase:
      name: deedpro-db
  - key: ALLOWED_ORIGINS
    value: https://deedpro-frontend-new.vercel.app
  # ── DECLARED BECAUSE ITS ABSENCE IS SILENT ────────────────────────
  #
  # `sync: false` means: this key is REQUIRED and its value is set in the
  # dashboard. Render will not overwrite it; the declaration exists so
  # that "which variables must this service have" is answerable from the
  # repository rather than from memory.
  #
  # FRONTEND_URL is first because it is the one that was missing from
  # every file while carrying the Stripe redirect path.
  - key: FRONTEND_URL
    sync: false
  - key: JWT_SECRET_KEY
    sync: false
  - key: STRIPE_SECRET_KEY
    sync: false
  - key: STRIPE_PROFESSIONAL_PRICE_ID
    sync: false
  # STRICT_ENV turns the boot-time report into a refusal to start.
  # DELIBERATELY UNSET until the owner has confirmed production carries
  # every required variable: a process that refuses to boot on an
  # unverified condition converts a wrong redirect into an outage.
  # Turning it on is this line, uncommented, in the ticket that verifies.
  # - key: STRICT_ENV
  #   value: "1"
  # Phase 3 Backend Services & Routes Configuration
  - key: DYNAMIC_WIZARD_ENABLED
    value: "false"
  - key: TEMPLATE_VALIDATION_STRICT
    value: "true"
  - key: PDF_GENERATION_TIMEOUT
    value: "30"
  - key: AI_ASSIST_TIMEOUT
    value: "15"
  - key: MAX_CONCURRENT_REQUESTS
    value: "5"
  - key: BACKEND_LOGGING_LEVEL
    value: "INFO"
  # Phase 4 QA Instrumentation for Staging
  - key: ENVIRONMENT
    value: "staging"
  - key: QA_INSTRUMENTATION_ENABLED
    value: "true"
  - key: QA_DETAILED_LOGGING
    value: "true"
  - key: PERFORMANCE_MONITORING
    value: "true"

# NOTE (A1, 2026-08-03): the second "deedpro-external-api" service was
# deleted here. It ran a separate FastAPI app that proxied deed generation
# back to this API using an internal-token concept this API never had, so
# every partner call 401d while its /healthz stayed green. The partner API
# is now /api/v1 on this service, next to the chassis it renders with.
